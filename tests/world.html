<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Partycombat — world check</title>
    <style>
      body { background: #14141c; color: #eee; font: 12px monospace; margin: 0; padding: 16px; }
      canvas { image-rendering: pixelated; display: block; margin: 6px 0 14px; }
      h2 { font-size: 12px; color: #ffd24a; margin: 0; letter-spacing: 0.1em; }
    </style>
  </head>
  <body>
    <div id="out">generating…</div>
    <script type="module">
      import { loadWorldArt, World, WORLD_W, WORLD_H } from '../js/world.js';

      const out = document.getElementById('out');
      await loadWorldArt();

      const seed = Number(new URLSearchParams(location.search).get('seed') ?? 12345);
      const t0 = performance.now();
      const w = new World(seed);
      const gen = performance.now() - t0;
      const t1 = performance.now();
      // Props are drawn per frame in the game so entities can sort against
      // them; compose a full picture here to eyeball placement.
      const baked = document.createElement('canvas');
      baked.width = WORLD_W;
      baked.height = WORLD_H;
      const bc = baked.getContext('2d');
      bc.imageSmoothingEnabled = false;
      bc.drawImage(w.bake(), 0, 0);
      for (const p of [...w.props].sort((a, b) => a.y - b.y)) {
        const r = w.propRect(p.name);
        bc.drawImage(w.sheet, r[0], r[1], r[2], r[3],
          Math.round(p.x - r[2] / 2), Math.round(p.y + p.foot - r[3]), r[2], r[3]);
      }
      const bake = performance.now() - t1;

      out.textContent = '';
      const info = document.createElement('h2');
      const counts = [0, 0, 0, 0];
      for (const k of w.kind) counts[k]++;
      const pct = counts.map((n) => ((n / w.kind.length) * 100).toFixed(1) + '%');
      info.textContent =
        `seed ${seed} · ${WORLD_W}x${WORLD_H} · gen ${gen.toFixed(0)}ms · bake ${bake.toFixed(0)}ms · ` +
        `${w.props.length} props · grass ${pct[0]} sand ${pct[1]} dirt ${pct[2]} water ${pct[3]}`;
      out.appendChild(info);

      // Whole island, scaled down.
      const overview = document.createElement('canvas');
      overview.width = WORLD_W / 2;
      overview.height = WORLD_H / 2;
      overview.getContext('2d').drawImage(baked, 0, 0, overview.width, overview.height);
      out.appendChild(overview);

      // A 1:1 slice near the middle, which is what a phone camera actually shows.
      const h2 = document.createElement('h2');
      h2.textContent = 'centre at 1:1 (roughly one phone viewport)';
      out.appendChild(h2);
      const slice = document.createElement('canvas');
      slice.width = 420;
      slice.height = 260;
      slice.style.width = '840px';
      slice.getContext('2d').drawImage(baked, WORLD_W / 2 - 210, WORLD_H / 2 - 130, 420, 260, 0, 0, 420, 260);
      out.appendChild(slice);

      window.__ready = true;
    </script>
  </body>
</html>
