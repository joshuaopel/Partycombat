<!doctype html>
<html><head><meta charset="utf-8"><title>sim test</title></head><body>
<pre id="log"></pre>
<script type="module">
import { Game } from '../js/game.js';
import { waveSpec } from '../js/enemies.js';

const out = [];
const ok = (c, m) => out.push((c ? 'PASS ' : 'FAIL ') + m);
const step = (g, secs, dt = 1 / 60) => { for (let i = 0; i < secs / dt; i++) g.update(dt); };

// ---- 1. a lone player can clear wave 1 by mashing attack while chasing
{
  const g = new Game({ seed: 101 });
  const p = g.addPlayer('a', 'TEST');
  ok(!!p && p.slot === 0, 'addPlayer seats slot 0');
  g.start();
  step(g, 3); // burn the intro intermission
  ok(g.state === 'fighting' && g.wave === 1, `wave 1 started (state=${g.state} wave=${g.wave})`);

  let guard = 0;
  const before = g.score;
  while (g.wave === 1 && g.state === 'fighting' && guard++ < 60 * 60) {
    // Steer at the nearest enemy and swing constantly.
    const e = g.enemies[0];
    if (e) {
      const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy) || 1;
      g.setInput('a', { ax: dx / d, ay: dy / d, attack: true });
    }
    p.hp = p.maxHp; // immortal so the test measures offence, not survival
    p.downed = false;
    g.update(1 / 60);
  }
  ok(g.score > before, `kills scored points (score=${g.score})`);
  ok(g.wave === 1 && g.state === 'intermission', `wave 1 cleared into intermission (state=${g.state})`);
}

// ---- 2. enemies damage and eventually down a passive player
{
  const g = new Game({ seed: 102 });
  const p = g.addPlayer('a', 'PASSIVE');
  g.start();
  step(g, 3);
  const startHp = p.hp;
  step(g, 25);
  ok(p.hp < startHp || p.downed, `passive player took damage (hp=${p.hp} downed=${p.downed})`);
}

// ---- 3. solo down => gameover; two players => revive works
{
  const g = new Game({ seed: 103 });
  const p = g.addPlayer('a', 'SOLO');
  g.start();
  step(g, 3);
  g.hurtPlayer(p, 99);
  ok(p.downed, 'lethal damage downs the player');
  g.update(1 / 60);
  ok(g.state === 'gameover', `last player down ends the run (state=${g.state})`);
}
{
  const g = new Game({ seed: 104 });
  const a = g.addPlayer('a', 'A');
  const b = g.addPlayer('b', 'B');
  ok(a.slot !== b.slot, 'two players get different slots');
  g.start();
  step(g, 3);
  g.hurtPlayer(a, 99);
  ok(a.downed && g.state !== 'gameover', 'one down does not end the run');
  b.x = a.x; b.y = a.y; // stand over the body
  for (let i = 0; i < 60 * 4; i++) { b.x = a.x; b.y = a.y; g.update(1 / 60); }
  ok(!a.downed && a.hp > 0, `teammate revived them (downed=${a.downed} hp=${a.hp})`);
}

// ---- 3b. bleeding out blocks teammate revives, clearing the wave restores you
{
  const g = new Game({ seed: 105 });
  const a = g.addPlayer('a', 'A');
  const b = g.addPlayer('b', 'B');
  g.start();
  step(g, 3);
  g.hurtPlayer(a, 99);
  a.bleed = 0.01;
  step(g, 0.5);
  ok(a.out, 'bleedout clock marks the player as out');
  for (let i = 0; i < 60 * 5; i++) { b.x = a.x; b.y = a.y; g.update(1 / 60); }
  ok(a.downed, 'a bled-out player cannot be revived by a teammate');

  // Clear the wave for them: wipe the field and drain the spawn queue.
  g.enemies.length = 0;
  g.spawnQueue.length = 0;
  step(g, 0.2);
  ok(!a.downed && !a.out && a.hp > 0, `wave clear brings them back (downed=${a.downed} hp=${a.hp})`);
}

// ---- 4. wave curve: boss every 5th, roster widens
{
  ok(waveSpec(5).isBoss && !waveSpec(4).isBoss, 'wave 5 is a boss wave, wave 4 is not');
  ok(waveSpec(5).list.some(l => l.type === 'knight'), 'boss wave includes the knight');
  const late = waveSpec(12);
  ok(late.hpMul > waveSpec(1).hpMul, 'later waves have an hp multiplier');
  const types = new Set();
  for (let w = 1; w <= 12; w++) for (const l of waveSpec(w).list) types.add(l.type);
  ok(types.size >= 5, `roster widens over 12 waves (${[...types].join(',')})`);
}

// ---- 5. a boss wave actually runs without exploding
{
  const g = new Game({ seed: 106 });
  const p = g.addPlayer('a', 'X');
  g.start();
  step(g, 3);
  g.beginWave(5);
  for (let i = 0; i < 60 * 20; i++) {
    p.hp = p.maxHp; p.downed = false;
    g.setInput('a', { ax: Math.sin(i / 40), ay: Math.cos(i / 33), attack: true });
    g.update(1 / 60);
  }
  ok(g.enemies.some(e => e.def.boss) || g.wave > 5, 'boss present and simulating');
  ok(Number.isFinite(g.enemies.reduce((s, e) => s + e.x + e.y, 0)), 'no NaN positions after boss wave');
}

// ---- 6. six players all fit, seventh is refused
{
  const g = new Game({ seed: 107 });
  for (let i = 0; i < 6; i++) ok(!!g.addPlayer('p' + i, 'P' + i), `player ${i + 1} seated`);
  ok(g.addPlayer('p6', 'P6') === null, 'seventh player refused');
  const slots = new Set([...g.players.values()].map(p => p.slot));
  ok(slots.size === 6, 'six distinct colour slots');
  g.removePlayer('p2');
  const n = g.addPlayer('p7', 'NEW');
  ok(n && n.slot === 2, 'freed slot is reused');
}

// ---- 7. the world bounds and blocks correctly
{
  const g = new Game({ seed: 4242 });
  const p = g.addPlayer('a', 'W');
  g.start(); step(g, 3);
  ok(!g.world.blocked(p.x, p.y), 'players spawn on walkable ground');

  // Walk hard into the north-west for a long time: the island's water ring
  // has to stop them well before the world origin.
  for (let i = 0; i < 60 * 40; i++) { g.setInput('a', { ax: -1, ay: -1 }); g.update(1 / 60); }
  ok(p.x > 4 && p.y > 4, `kept inside the world (x=${p.x.toFixed(1)} y=${p.y.toFixed(1)})`);
  ok(!g.world.blocked(p.x, p.y), 'never ends up standing in water or a tree');

  // Dropped on top of a solid prop, collision pushes back out.
  // Collision itself, independent of whether a player happens to be upright.
  const tree = g.world.props.find((q) => q.r > 10);
  const dead = { x: tree.x, y: tree.y }; // exactly centred: the degenerate case
  g.world.collide(dead, 7);
  ok(Math.hypot(dead.x - tree.x, dead.y - tree.y) >= tree.r,
     `pushed out of a prop from dead centre (${Math.hypot(dead.x - tree.x, dead.y - tree.y).toFixed(1)} vs r=${tree.r})`);

  // Walking straight at a shoreline should slide along it, not stop dead.
  let shore = null;
  for (const q of [...Array(4000).keys()]) {
    const x = 30 + (q * 37) % (g.world.w - 60);
    const y = 30 + (q * 91) % (g.world.h - 60);
    if (!g.world.inWater(x, y, 7) && g.world.inWater(x + 20, y, 7)) { shore = { x, y }; break; }
  }
  ok(!!shore, 'found a shoreline to test against');
  if (shore) {
    const body = { x: shore.x, y: shore.y };
    for (let i = 0; i < 120; i++) g.world.move(body, 2, 1.2, 7);
    ok(!g.world.inWater(body.x, body.y, 7), 'walking into water never enters it');
    ok(body.y > shore.y + 5, `still slides along the shore (moved ${(body.y - shore.y).toFixed(0)}px along)`);
  }
}

// ---- 7b. props are spaced apart and solid
{
  const { World } = await import('../js/world.js');
  const w = new World(31337);
  const trees = w.props.filter((p) => p.name.startsWith('tree'));
  ok(trees.length > 40, `island grew a decent wood (${trees.length} trees)`);

  // No two trees may overlap: canopies are ~60px wide, so their centres have
  // to stay at least that far apart or they read as one green smear.
  let worst = Infinity, pair = null;
  for (let i = 0; i < trees.length; i++) {
    for (let j = i + 1; j < trees.length; j++) {
      const d = Math.hypot(trees[i].x - trees[j].x, trees[i].y - trees[j].y);
      if (d < worst) { worst = d; pair = [trees[i], trees[j]]; }
    }
  }
  ok(worst >= 60, `no two trees overlap (closest pair ${worst.toFixed(1)}px apart)`);

  // Every prop keeps its distance from every other, not just its own kind.
  let bad = 0;
  for (let i = 0; i < w.props.length; i++) {
    for (let j = i + 1; j < w.props.length; j++) {
      const a = w.props[i], b = w.props[j];
      const need = Math.max(a.name.startsWith('tree') ? 60 : 18, b.name.startsWith('tree') ? 60 : 18);
      if (Math.hypot(a.x - b.x, a.y - b.y) < Math.min(need, 18)) bad++;
    }
  }
  ok(bad === 0, `no props stacked on each other (${bad} violations)`);

  // Trees block, like any other obstacle.
  const tree = trees.find((t) => !w.blocked(t.x, t.y - 70));
  ok(tree.r > 12, `trees carry a real blocking radius (r=${tree.r})`);
  // Walk straight down through where the trunk is. Sliding around it is fine
  // and expected; what matters is never getting inside the radius, so track
  // the closest approach over the whole path rather than the end point.
  const body = { x: tree.x, y: tree.y - 70 };
  let closest = Infinity;
  for (let i = 0; i < 300; i++) {
    w.move(body, 0, 1.4, 7);
    closest = Math.min(closest, Math.hypot(body.x - tree.x, body.y - tree.y));
  }
  ok(closest >= tree.r,
     `never penetrates a tree while walking through it (closest ${closest.toFixed(1)}px, r=${tree.r})`);
  ok(body.y > tree.y, 'and still gets past it rather than jamming');
  ok(w.blocked(tree.x, tree.y), 'a tree trunk reads as blocked ground');
}

// ---- 8. the same seed builds the same island on host and phone
{
  const { World } = await import('../js/world.js');
  const a = new World(987654);
  const b = new World(987654);
  const c = new World(987655);
  ok(a.kind.every((v, i) => v === b.kind[i]), 'same seed gives identical terrain');
  ok(a.props.length === b.props.length &&
     a.props.every((p, i) => p.x === b.props[i].x && p.y === b.props[i].y && p.name === b.props[i].name),
     'same seed gives identical props');
  ok(!c.kind.every((v, i) => v === a.kind[i]), 'a different seed gives a different island');
}

// ---- 9. snapshots round-trip through the client decoder
{
  const { SceneBuffer } = await import('../js/scene.js');
  const g = new Game({ seed: 77 });
  const a = g.addPlayer('a', 'ALPHA');
  const b = g.addPlayer('b', 'BETA');
  g.start(); step(g, 4);
  const snap = g.snapshot();
  ok(snap.p.length === 2, `snapshot carries both players (${snap.p.length})`);
  ok(snap.e.length === g.enemies.length, `snapshot carries every enemy (${snap.e.length})`);

  const buf = new SceneBuffer();
  buf.setRoster([{ slot: a.slot, id: 'a', name: 'ALPHA' }, { slot: b.slot, id: 'b', name: 'BETA' }]);
  const t0 = performance.now();
  buf.push(snap, t0);
  step(g, 0.2);
  buf.push(g.snapshot(), t0 + 66);
  const sc = buf.sample(t0 + 66);
  ok(!!sc, 'buffer produces a scene');
  ok(sc.players.length === 2 && sc.players.some((p) => p.name === 'ALPHA'),
     'decoded players keep their roster names');
  ok(sc.players.every((p) => Number.isFinite(p.x) && Number.isFinite(p.y)),
     'decoded positions are finite');
  const near = sc.players.find((p) => p.slot === a.slot);
  ok(Math.hypot(near.x - a.x, near.y - a.y) < 24,
     `decoded position tracks the simulation (off by ${Math.hypot(near.x - a.x, near.y - a.y).toFixed(1)}px)`);
  ok(sc.enemies.every((e) => typeof e.type === 'string'), 'decoded enemies have known types');

  // Bandwidth only matters on a busy field, so measure a late wave rather
  // than the three enemies wave 1 opens with.
  const busy = new Game({ seed: 5 });
  for (let i = 0; i < 6; i++) busy.addPlayer('q' + i, 'HERO' + i);
  busy.start(); step(busy, 3);
  busy.beginWave(14);
  step(busy, 14);
  const bigSnap = busy.snapshot();
  const size = JSON.stringify(bigSnap).length;
  const perSec = ((size * 15) / 1024).toFixed(0);
  ok(bigSnap.e.length >= 10, `busy field for the size check (${bigSnap.e.length} enemies, 6 players)`);
  ok(size < 4000, `snapshot stays small (${size} bytes -> ~${perSec} KB/s per phone at 15 Hz)`);
}

document.getElementById('log').textContent = out.join('\n');
window.__results = out;
window.__done = true;
</script></body></html>
