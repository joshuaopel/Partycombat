<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Partycombat</title>
    <meta name="description" content="A six-player couch co-op wave defence game. One screen hosts, everyone else plays on their phone." />
    <link rel="stylesheet" href="css/common.css" />
    <style>
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 2rem 1.25rem;
        text-align: center;
      }
      .logo {
        font-size: clamp(2.5rem, 9vw, 5rem);
        line-height: 1;
        color: var(--gold);
        text-shadow: 0 4px 0 #7a4f08, 0 8px 24px rgba(255, 210, 74, 0.25);
      }
      .tag {
        color: var(--muted);
        max-width: 34ch;
        line-height: 1.6;
        font-size: 0.9rem;
      }
      .choices {
        display: grid;
        gap: 1rem;
        width: min(100%, 380px);
      }
      .choices a {
        text-decoration: none;
      }
      .big {
        display: block;
        width: 100%;
        padding: 1.4rem;
        font-size: 1.1rem;
        border-radius: 14px;
      }
      .sub {
        display: block;
        font-size: 0.72rem;
        text-transform: none;
        letter-spacing: 0;
        opacity: 0.75;
        margin-top: 0.35rem;
      }
      footer {
        color: #5f5880;
        font-size: 0.7rem;
        line-height: 1.7;
        max-width: 46ch;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <h1 class="logo">Partycombat</h1>
        <p class="tag">
          Up to six heroes hold an arena against endless waves. Put the host on the
          big screen, then everyone joins with their phone.
        </p>
      </div>

      <div class="choices">
        <a href="host.html"
          ><button class="big primary">
            Host a game <span class="sub">Use the TV, laptop or monitor</span>
          </button></a
        >
        <a href="play.html"
          ><button class="big">
            Join a game <span class="sub">Your phone becomes the controller</span>
          </button></a
        >
      </div>

      <footer>
        Everything runs peer-to-peer in the browser — no accounts, no server.
        Best on the same Wi-Fi. Personal, non-commercial fan project; all artwork
        is original.
      </footer>
    </div>
  </body>
</html>
