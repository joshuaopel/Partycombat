name: Deploy to GitHub Pages

# Manual only. The simplest way to publish this site is Settings -> Pages ->
# Source -> "Deploy from a branch" (main / root), which needs no Actions
# permissions at all. This workflow is the alternative for anyone who wants
# Actions-based deploys; it needs Settings -> Actions -> General -> Workflow
# permissions set to "Read and write", otherwise configure-pages fails with
# "Resource not accessible by integration". Left off the push trigger so it
# can't redden every commit on repos that haven't granted that.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement turns Pages on via the API if it isn't already, so a fresh
      # clone of this repo deploys without anyone visiting Settings first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # No build step — the repository root is the site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
